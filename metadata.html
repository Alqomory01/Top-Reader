<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopReader — Metadata & Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #030405; --brand: #5170ff; --brand-light: #7b8eff;
    --brand-glow: rgba(81,112,255,0.15); --surface: #0d0f14;
    --border: rgba(255,255,255,0.07); --text: #e8eaf0; --muted: #7a7f94;
    --input-bg: #0a0c10;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 250px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 32px 0;
    flex-shrink: 0;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 24px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--brand);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .steps-list {
    list-style: none;
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
  }

  .step-item.active {
    background: rgba(81,112,255,0.08);
  }

  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.72rem;
  }

  /* MAIN */
  .main {
    flex: 1;
    overflow-x: hidden;
  }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 18px 20px;
    font-size: 0.875rem;
    color: var(--muted);
    cursor: pointer;
  }

  .tab.active {
    color: var(--brand);
  }

  .tab-content {
    display: none;
    padding: 36px 48px;
  }

  .tab-content.active {
    display: block;
  }

  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.35rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }

  .page-sub {
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* FORM */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 700px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
  }

  .form-group-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  input, select, textarea {
    background: var(--input-bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text);
    width: 100%;
  }

  /* PRICING */
  .pricing-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
  }

  .pricing-option {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .pricing-option.selected {
    border-color: var(--brand);
    background: rgba(81,112,255,0.05);
  }

  .pricing-details {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 14px;
  }

  .price-input input {
    padding-left: 30px;
  }

  /* ================= RESPONSIVE ================= */

  /* Tablets */
  @media (max-width: 1024px) {
    .pricing-layout {
      grid-template-columns: 1fr;
    }

    .tabs {
      padding: 0 20px;
    }

    .tab-content {
      padding: 24px 20px;
    }
  }

  /* Mobile */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px;
    }

    .steps-list {
      display: flex;
      gap: 10px;
    }

    .step-item {
      flex-shrink: 0;
    }

    .form-group-row {
      grid-template-columns: 1fr;
    }

    .tabs {
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
    }

    .tab {
      flex-shrink: 0;
    }
  }

  /* Small Mobile */
  @media (max-width: 480px) {
    .tab-content {
      padding: 18px 14px;
    }

    .form-card,
    .pricing-details {
      padding: 16px;
    }

    .page-title {
      font-size: 1.1rem;
    }

    .pricing-layout {
      gap: 16px;
    }
  }

</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">TR</div>
    <span>TopReader</span>
  </div>

  <ul class="steps-list">
    <li class="step-item active"><div class="step-num">5</div>Metadata</li>
    <li class="step-item">6 Pricing</li>
    <li class="step-item">7 Review</li>
  </ul>
</aside>

<!-- MAIN -->
<div class="main">

  <div class="tabs">
    <div class="tab active">Metadata</div>
    <div class="tab">Pricing</div>
  </div>

  <!-- METADATA -->
  <div class="tab-content active">
    <div class="page-title">Metadata</div>
    <div class="page-sub">Add book details</div>

    <div class="form-card">
      
      

      <div class="form-group-row">
        <input placeholder="Name">
        <input placeholder="Title">
        <input placeholder="SubTitle">
        <input placeholder="Contributors">
        <input placeholder="Edition">
        <textarea placeholder="Description"></textarea>
      </div>
    </div>
  </div>

  <!-- PRICING -->
  <div class="tab-content">
    <div class="page-title">Pricing</div>

    <div class="pricing-layout">

      <div>
        <div class="pricing-option selected">Paid Access</div>
        <div class="pricing-option">Free Access</div>
      </div>

      <div class="pricing-details">
        <input type="number" placeholder="Price">
        <p style="color: var(--muted); font-size: 0.8rem; margin-top: 10px;">
          You earn 70%
        </p>
      </div>

    </div>
  </div>

</div>

</body>
</html>
